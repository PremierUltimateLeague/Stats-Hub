name: Build and Deploy Stats Hub

on:
  # Trigger on push to main
  push:
    branches: [main, feat/astro-rewrite]
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Optional: scheduled builds during season (uncomment if needed)
  # schedule:
  #   - cron: '0 6 * * *'  # Daily at 6am UTC

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: processing/requirements.txt

      - name: Install Python dependencies
        run: pip install -r processing/requirements.txt

      - name: Run data export
        run: python processing/export_json.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
